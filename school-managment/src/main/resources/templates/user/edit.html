<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<head>
    <title>Edit Staff / User</title>
</head>

<body>

<div layout:fragment="content">

    <div class="row justify-content-center">
        <div class="col-lg-9">
            <!-- Navigation Back -->
            <div class="mb-3">
                <a th:href="@{/web/users/{id}(id=${userId})}" class="text-decoration-none text-muted">
                    <i class="bi bi-arrow-left me-1"></i>Back to User Profile
                </a>
            </div>

            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-header bg-white border-bottom p-4">
                    <h5 class="fw-bold mb-0 text-dark">
                        <i class="bi bi-pencil-square text-warning me-2"></i>Edit Staff / User Profile
                    </h5>
                    <p class="text-muted small mb-0 mt-1">Update employee profile, department, designation, and status.</p>
                </div>

                <div class="card-body p-4">
                    <form th:action="@{/web/users/{id}/edit(id=${userId})}" th:object="${userDto}" method="post">

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="name" class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                                <input type="text" id="name" th:field="*{name}" class="form-control py-2" required>
                            </div>

                            <div class="col-md-6">
                                <label for="phone" class="form-label fw-semibold">Phone Number</label>
                                <input type="text" id="phone" th:field="*{phone}" class="form-control py-2">
                            </div>

                            <div class="col-md-6">
                                <label for="role" class="form-label fw-semibold">System Role <span class="text-danger">*</span></label>
                                <select id="role" th:field="*{role}" class="form-select py-2" required>
                                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}">ROLE</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="employeeId" class="form-label fw-semibold">Employee ID / Code</label>
                                <input type="text" id="employeeId" th:field="*{employeeId}" class="form-control py-2">
                            </div>

                            <div class="col-md-6">
                                <label for="joiningDate" class="form-label fw-semibold">Joining Date</label>
                                <input type="date" id="joiningDate" th:field="*{joiningDate}" class="form-control py-2">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Status</label>
                                <div class="form-check form-switch mt-1">
                                    <input class="form-check-input" type="checkbox" role="switch" id="isActive" th:field="*{isActive}">
                                    <label class="form-check-label ms-2 fw-semibold" for="isActive">User Account Active</label>
                                </div>
                            </div>

                            <!-- Department & Designation Assignment -->
                            <div class="col-12"><hr class="my-3"></div>
                            <div class="col-12">
                                <h6 class="fw-bold text-dark mb-1">
                                    <i class="bi bi-diagram-3-fill text-primary me-2"></i>Department & Designation Assignment
                                </h6>
                            </div>

                            <div class="col-md-6">
                                <label for="departmentId" class="form-label fw-semibold">Department</label>
                                <select id="departmentId" th:field="*{departmentId}" class="form-select py-2" onchange="loadDesignations(this.value)">
                                    <option value="">-- Select Department --</option>
                                    <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}">Department</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="designationId" class="form-label fw-semibold">Designation & Role</label>
                                <select id="designationId" th:field="*{designationId}" class="form-select py-2">
                                    <option value="">-- Select Designation --</option>
                                    <option th:each="d : ${designations}" th:value="${d.id}" th:text="${d.title}">Designation</option>
                                </select>
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                            <a th:href="@{/web/users/{id}(id=${userId})}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                            <button type="submit" class="btn btn-warning text-dark fw-semibold rounded-pill px-4">
                                <i class="bi bi-check-circle me-1"></i>Update User
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

</div>

<th:block layout:fragment="scripts">
<script>
    function loadDesignations(departmentId) {
        const designationSelect = document.getElementById('designationId');
        designationSelect.innerHTML = '<option value="">-- Loading Designations... --</option>';

        if (!departmentId) {
            designationSelect.innerHTML = '<option value="">-- Select Department First --</option>';
            return;
        }

        fetch('/api/v1/departments/' + departmentId + '/designations')
            .then(res => res.json())
            .then(response => {
                designationSelect.innerHTML = '<option value="">-- Select Designation --</option>';
                if (response.success && response.data && response.data.length > 0) {
                    response.data.forEach(d => {
                        const option = document.createElement('option');
                        option.value = d.id;
                        option.textContent = d.title + (d.code ? ' (' + d.code + ')' : '');
                        designationSelect.appendChild(option);
                    });
                } else {
                    designationSelect.innerHTML = '<option value="">-- No Designations Available --</option>';
                }
            })
            .catch(err => {
                console.error('Error fetching designations:', err);
                designationSelect.innerHTML = '<option value="">-- Error Loading --</option>';
            });
    }
</script>
</th:block>

</body>
</html>
