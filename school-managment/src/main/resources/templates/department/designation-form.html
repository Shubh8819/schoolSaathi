<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<head>
    <title th:text="${isEdit ? 'Edit Designation' : 'Add Designation'}">Designation Form</title>
</head>

<body>

<div layout:fragment="content">

    <div class="row justify-content-center">
        <div class="col-lg-9">
            <!-- Navigation Back -->
            <div class="mb-3">
                <a th:href="@{/web/departments/{id}(id=${department.id})}" class="text-decoration-none text-muted">
                    <i class="bi bi-arrow-left me-1"></i>Back to <span th:text="${department.name}">Department</span>
                </a>
            </div>

            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-header bg-white border-bottom p-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="fw-bold mb-0 text-dark">
                                <i th:class="${isEdit ? 'bi bi-pencil-square text-warning me-2' : 'bi bi-shield-plus text-primary me-2'}"></i>
                                <span th:text="${isEdit ? 'Edit Designation & Authorities' : 'Add Designation & Assign Authorities'}">Form</span>
                            </h5>
                            <p class="text-muted small mb-0 mt-1">
                                Department: <strong class="text-dark" th:text="${department.name}">Department Name</strong>
                            </p>
                        </div>
                    </div>
                </div>

                <div class="card-body p-4">
                    <form th:action="${isEdit} ? @{/web/departments/{deptId}/designations/{desigId}/edit(deptId=${department.id}, desigId=${designationDto.id})} : @{/web/departments/{deptId}/designations/add(deptId=${department.id})}"
                          th:object="${designationDto}" method="post">

                        <!-- Basic Information -->
                        <div class="row g-3 mb-4">
                            <div class="col-md-8">
                                <label for="title" class="form-label fw-semibold">Designation Title / Role Name <span class="text-danger">*</span></label>
                                <input type="text" id="title" th:field="*{title}" class="form-control py-2" placeholder="e.g. Senior Teacher, Accountant, Principal, Fee Clerk" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                            </div>

                            <div class="col-md-4">
                                <label for="code" class="form-label fw-semibold">Code / Abbreviation</label>
                                <input type="text" id="code" th:field="*{code}" class="form-control py-2 text-uppercase" placeholder="e.g. TCHR, ACCT">
                            </div>

                            <div class="col-12">
                                <label for="description" class="form-label fw-semibold">Role Description</label>
                                <textarea id="description" th:field="*{description}" class="form-control" rows="2" placeholder="Brief summary of duties and privileges..."></textarea>
                            </div>

                            <div class="col-12">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" role="switch" id="isActive" th:field="*{isActive}">
                                    <label class="form-check-label fw-semibold ms-2" for="isActive">Designation is Active</label>
                                </div>
                            </div>
                        </div>

                        <!-- Authorities Matrix -->
                        <div class="border-top pt-4">
                            <h6 class="fw-bold text-dark mb-1">
                                <i class="bi bi-shield-lock-fill text-primary me-2"></i>Assign Authorities & Action Rights
                            </h6>
                            <p class="text-muted small mb-3">Select the rights and capabilities granted to this designation:</p>

                            <div class="row g-3">
                                <div class="col-md-6" th:each="entry : ${authoritiesByCategory}">
                                    <div class="card border rounded-3 h-100 bg-light-subtle">
                                        <div class="card-header bg-light border-bottom py-2 fw-semibold text-dark d-flex justify-content-between align-items-center">
                                            <span>
                                                <i class="bi bi-gear-fill me-2 text-secondary"></i>
                                                <span th:text="${entry.key}">Category</span>
                                            </span>
                                        </div>
                                        <div class="card-body p-3">
                                            <div class="form-check form-switch mb-2" th:each="auth : ${entry.value}">
                                                <input class="form-check-input" type="checkbox"
                                                       th:field="*{authorities}"
                                                       th:value="${auth}"
                                                       th:id="${'auth_' + auth.name()}">
                                                <label class="form-check-label fw-medium ms-1 text-dark" th:for="${'auth_' + auth.name()}" th:text="${auth.displayName}">
                                                    Authority Name
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Form Actions -->
                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                            <a th:href="@{/web/departments/{id}(id=${department.id})}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary rounded-pill px-4">
                                <i class="bi bi-check-circle me-1"></i>
                                <span th:text="${isEdit ? 'Update Designation' : 'Save Designation'}">Save</span>
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
