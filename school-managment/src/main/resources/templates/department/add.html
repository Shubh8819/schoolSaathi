<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<head>
    <title>Add Department</title>
</head>

<body>

<div layout:fragment="content">

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <!-- Navigation Back -->
            <div class="mb-3">
                <a th:href="@{/web/departments}" class="text-decoration-none text-muted">
                    <i class="bi bi-arrow-left me-1"></i>Back to Departments
                </a>
            </div>

            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-header bg-white border-bottom p-4">
                    <h5 class="fw-bold mb-0 text-dark">
                        <i class="bi bi-folder-plus text-primary me-2"></i>Add New Department
                    </h5>
                    <p class="text-muted small mb-0 mt-1">Create a organizational department to group staff roles and designations.</p>
                </div>

                <div class="card-body p-4">
                    <form th:action="@{/web/departments/add}" th:object="${departmentDto}" method="post">
                        
                        <div class="row g-3">
                            <!-- Department Name -->
                            <div class="col-md-8">
                                <label for="name" class="form-label fw-semibold">Department Name <span class="text-danger">*</span></label>
                                <input type="text" id="name" th:field="*{name}" class="form-control py-2" placeholder="e.g. Academic Wing, Accounts, Administration" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>

                            <!-- Code -->
                            <div class="col-md-4">
                                <label for="code" class="form-label fw-semibold">Code / Abbreviation</label>
                                <input type="text" id="code" th:field="*{code}" class="form-control py-2 text-uppercase" placeholder="e.g. ACAD, FIN, ADM">
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                            </div>

                            <!-- Description -->
                            <div class="col-12">
                                <label for="description" class="form-label fw-semibold">Description</label>
                                <textarea id="description" th:field="*{description}" class="form-control" rows="3" placeholder="Brief details about the responsibilities of this department..."></textarea>
                            </div>

                            <!-- Status Switch -->
                            <div class="col-12">
                                <div class="form-check form-switch mt-2">
                                    <input class="form-check-input" type="checkbox" role="switch" id="isActive" th:field="*{isActive}">
                                    <label class="form-check-label fw-semibold ms-2" for="isActive">Department is Active</label>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                            <a th:href="@{/web/departments}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary rounded-pill px-4">
                                <i class="bi bi-check-circle me-1"></i>Save Department
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
