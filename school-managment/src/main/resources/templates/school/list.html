<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<head>
    <title>Schools</title>
</head>

<body>

<div layout:fragment="content">

    <!-- Page Header -->
    <div class="d-flex justify-content-between
                align-items-center mb-4">
        <div>
            <h4 class="mb-1 fw-bold">Schools</h4>
            <p class="text-muted mb-0">
                Manage all registered schools
            </p>
        </div>
        <a th:href="@{/web/schools/add}"
           class="btn btn-primary">
            <i class="bi bi-plus-circle me-2"></i>
            Add School
        </a>
    </div>

    <!-- Stats Cards -->
    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <div>
                            <p class="text-muted small mb-1">
                                Total Schools
                            </p>
                            <h4 class="fw-bold mb-0"
                                th:text="${totalSchools}">
                                0
                            </h4>
                        </div>
                        <div class="bg-primary bg-opacity-10
                                    rounded p-3">
                            <i class="bi bi-building
                                      text-primary fs-4">
                            </i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Search Bar -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/web/schools}"
                  method="get">
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-search"></i>
                    </span>
                    <label>
                        <input type="text"
                               name="keyword"
                               class="form-control"
                               placeholder="Search by name, city, code..."
                               th:value="${keyword}">
                    </label>
                    <button class="btn btn-primary"
                            type="submit">
                        Search
                    </button>
                    <a th:href="@{/web/schools}"
                       class="btn btn-outline-secondary">
                        Clear
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Schools Table -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Code</th>
                        <th>School Name</th>
                        <th>City</th>
                        <th>Board</th>
                        <th>Plan</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>

                    <!-- No Schools -->
                    <tr th:if="${#lists.isEmpty(schools)}">
                        <td colspan="7"
                            class="text-center py-5">
                            <i class="bi bi-building
                                          text-muted fs-1">
                            </i>
                            <p class="text-muted mt-2">
                                No schools found
                            </p>
                            <a th:href="@{/web/schools/add}"
                               class="btn btn-primary btn-sm">
                                Add First School
                            </a>
                        </td>
                    </tr>

                    <!-- School Rows -->
                    <tr th:each="school : ${schools}">
                        <td>
                                <span class="badge bg-secondary">
                                    <span th:text="${school.schoolCode}">
                                    </span>
                                </span>
                        </td>
                        <td>
                            <div class="fw-semibold"
                                 th:text="${school.name}">
                            </div>
                            <small class="text-muted"
                                   th:text="${school.principalName}">
                            </small>
                        </td>
                        <td th:text="${school.city}"></td>
                        <td>
                                <span class="badge bg-info text-dark"
                                      th:text="${school.boardType}">
                                </span>
                        </td>
                        <td>
                                <span th:text="${school.subscriptionPlan}"
                                      th:classappend="${school.isTrial} ? 'badge bg-warning text-dark' : 'badge bg-success'">
                                </span>
                        </td>
                        <td>
                                <span th:if="${school.isActive}"
                                      class="badge bg-success">
                                    Active
                                </span>
                            <span th:unless="${school.isActive}"
                                  class="badge bg-danger">
                                    Inactive
                                </span>
                        </td>
                        <td>
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{/web/schools/{id}(id=${school.id})}"
                                   class="btn btn-outline-primary"
                                   title="View">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:href="@{/web/schools/{id}/edit(id=${school.id})}"
                                   class="btn btn-outline-warning"
                                   title="Edit">
                                    <i class="bi bi-pencil"></i>
                                </a>
                            </div>
                        </td>
                    </tr>

                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</body>
</html>
