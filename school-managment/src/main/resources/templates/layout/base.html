<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${pageTitle} + ' | SchoolSaathi'">
        SchoolSaathi
    </title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link th:href="@{/css/common.css}" rel="stylesheet">
</head>

<body>

<!-- Sidebar -->
<div class="wrapper">

    <!-- Sidebar -->
    <nav id="sidebar" th:replace="~{layout/sidebar :: sidebar}">
    </nav>

    <!-- Content -->
    <div id="content">

        <!-- Navbar -->
        <nav th:replace="~{layout/navbar :: navbar}">
        </nav>

        <!-- Flash Messages -->
        <div class="container-fluid mt-3">

            <!-- Success -->
            <div th:if="${successMessage}"
                 class="alert alert-success
                            alert-dismissible fade show"
                 role="alert">
                <i class="bi bi-check-circle me-2"></i>
                <span th:text="${successMessage}"></span>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                </button>
            </div>

            <!-- Error -->
            <div th:if="${errorMessage}"
                 class="alert alert-danger
                            alert-dismissible fade show"
                 role="alert">
                <i class="bi bi-exclamation-circle me-2"></i>
                <span th:text="${errorMessage}"></span>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                </button>
            </div>

        </div>

        <!-- Main Content -->
        <div class="container-fluid px-4">
            <div layout:fragment="content">
                <!-- Har page ka content yahan aayega -->
            </div>
        </div>

        <footer class="footer mt-auto py-3 bg-light border-top">
            <div class="container-fluid px-4">
                <div class="row align-items-center">
                    <!-- Left: Copyright -->
                    <div class="col-md-6 text-center text-md-start">
                        <span class="text-muted small">
                            &copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span>
                            SchoolSaathi. All rights reserved.
                        </span>
                    </div>

                    <!-- Right: Links / Version -->
                    <div class="col-md-6 text-center text-md-end">
                        <span class="text-muted small me-3">
                            <i class="bi bi-code-square me-1"></i> v1.0.0
                        </span>
                        <a href="#" class="text-muted small me-2 text-decoration-none">
                            <i class="bi bi-question-circle me-1"></i>Help
                        </a>
                        <a href="#" class="text-muted small text-decoration-none">
                            <i class="bi bi-envelope me-1"></i>Support
                        </a>
                    </div>
                </div>
            </div>
        </footer>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>

<!-- Custom JS -->
<script th:src="@{/js/app.js}"></script>
<!-- body ke end mein, Bootstrap script ke baad -->
<th:block layout:fragment="scripts"></th:block>

</body>
</html>
