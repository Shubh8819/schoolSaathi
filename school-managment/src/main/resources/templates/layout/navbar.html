<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="">

<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom"
     th:fragment="navbar">

    <div class="container-fluid">

        <!-- Sidebar Toggle -->
        <button type="button" id="sidebarCollapse" class="btn btn-outline-secondary">
            <i class="bi bi-list"></i>
        </button>

        <!-- Page Title -->
        <span class="navbar-brand ms-3 fw-bold" th:text="${pageTitle}"> </span>

        <div class="ms-auto d-flex align-items-center">

            <!-- School Name -->
          <!--  <span class="text-muted me-3 small"
                  sec:authentication="principal.schoolName">
            </span>-->
            <span class="text-muted me-3 small">hello</span>

            <!-- User Dropdown -->
            <div class="dropdown">
                <button class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">
                    <i class="bi bi-person-circle me-1"></i>
                    <span sec:authentication="name">
                        User
                    </span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li>
                        <a class="dropdown-item" th:href="@{/web/profile}">
                            <i class="bi bi-person me-2"></i>
                            Profile
                        </a>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <form th:action="@{/logout}"
                              method="post">
                            <button class="dropdown-item  text-danger" type="submit">
                                <i class="bi bi-box-arrow-right me-2"></i>
                                Logout
                            </button>
                        </form>
                    </li>
                </ul>
            </div>

        </div>
    </div>
</nav>
</body>
</html>
