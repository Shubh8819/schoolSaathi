<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<!--
  NOTE: Wrap in th:fragment="content" and th:replace into your dashboard layout
  the same way Principal Dashboard does, so the sidebar/nav stays consistent.
-->
<head>
    <meta charset="UTF-8">
    <title>Students - SchoolSaathi</title>
    <style>
        :root {
            --primary: #2563eb; --primary-dark: #1d4ed8; --border: #e2e8f0;
            --bg-light: #f8fafc; --text-dark: #1e293b; --text-muted: #64748b;
            --success: #16a34a; --pending: #d97706;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-light); margin: 0; color: var(--text-dark); }
        .page-content { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
        .top-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
        .top-row h1 { font-size: 22px; margin: 0; }
        .stat-badge { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 6px 14px; font-size: 13px; color: var(--text-muted); }
        .stat-badge b { color: var(--text-dark); }

        .toolbar { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .search-box input { padding: 9px 14px; border: 1px solid var(--border); border-radius: 8px; width: 260px; font-size: 14px; }
        .btn { padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }

        .alert-success { background: #f0fdf4; color: var(--success); border: 1px solid #bbf7d0; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }

        table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        thead { background: var(--bg-light); }
        th, td { text-align: left; padding: 12px 14px; font-size: 13.5px; border-bottom: 1px solid var(--border); }
        th { color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 11.5px; letter-spacing: 0.03em; }
        tr:last-child td { border-bottom: none; }
        .badge { padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-active { background: #f0fdf4; color: var(--success); }
        .badge-pending { background: #fffbeb; color: var(--pending); }
        .badge-other { background: #f1f5f9; color: var(--text-muted); }
        .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }

        .pagination { display: flex; gap: 8px; justify-content: center; margin-top: 20px; }
        .pagination a { padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; text-decoration: none; color: var(--text-dark); font-size: 13px; }
        .pagination a.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="top-row">
        <h1>Students</h1>
        <div class="stat-badge">Total: <b th:text="${totalStudents}">0</b></div>
    </div>

    <div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>

    <div class="toolbar">
        <form class="search-box" th:action="@{/students}" method="get">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="Search name, admission no, roll no..." />
        </form>
        <a th:href="@{/web/students/add}" class="btn btn-primary">+ Add Student</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>Admission No.</th>
            <th>Name</th>
            <th>Class</th>
            <th>Roll No.</th>
            <th>Guardian Contact</th>
            <th>Status</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${students.content}">
            <td th:text="${s.admissionNumber}"></td>
            <td th:text="${s.fullName}"></td>
            <!--<td th:text="${s.className} + ' - ' + ${s.section}"></td>-->
           <!-- <td th:text="${s.rollNumber}"></td>-->
            <!--<td th:text="${s.guardianContactNumber}"></td>-->
            <td>
                <span class="badge"
                      th:classappend="${s.status.name() == 'ACTIVE'} ? 'badge-active' : (${s.status.name() == 'PENDING_APPROVAL'} ? 'badge-pending' : 'badge-other')"
                      th:text="${s.status}"></span>
            </td>
            <td><a th:href="@{/students/{id}(id=${s.id})}">View</a></td>
        </tr>
        </tbody>
    </table>

    <div class="empty-state" th:if="${students.content.isEmpty()}">
        No students found. Click "Add Student" to create the first record.
    </div>

    <div class="pagination" th:if="${students.totalPages > 1}">
        <a th:each="i : ${#numbers.sequence(0, students.totalPages - 1)}"
           th:href="@{/students(page=${i}, keyword=${keyword})}"
           th:text="${i + 1}"
           th:classappend="${i == students.number} ? 'active' : ''"></a>
    </div>
</div>
</body>
</html>
